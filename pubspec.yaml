name: nova_wallet
description: "NovaWallet Mobile — Send & Save (FirstBank Digital Factory take-home)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7

  # DI + functional results (Kiba)
  get_it: ^8.2.0
  dartz: ^0.10.1

  # Routing / responsiveness (Kiba)
  go_router: ^16.2.4
  flutter_screenutil: ^5.9.3

  # Storage — Isar is the only durable queue and the only cache
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Real backend (Amendment B): Firebase Auth + Cloud Firestore
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.2

  # Platform
  connectivity_plus: ^6.1.5
  biometric_signature: ^13.0.0
  flutter_local_notifications: ^22.2.0

  # UI helpers
  pinput: ^5.0.2
  shimmer: ^3.0.0

  # Utils
  intl: any
  uuid: ^4.5.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  build_runner: ^2.10.5
  isar_community_generator: 3.3.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  config:
    # Same reason as Kiba: biometric_signature's SPM manifest fights other pods.
    enable-swift-package-manager: false

  # Plus Jakarta Sans (SIL OFL 1.1, see assets/fonts/OFL.txt): one variable font
  # covering weights 200–800, with the Yorùbá diacritics (ẹ ọ ṣ + tone marks)
  # and the naira sign verified present. Bundled, never fetched at runtime.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
